<!DOCTYPE html>

<html>

<head>
	<link rel="stylesheet" href="styles.css">
</head>

<body>
	<!-- the entire body must be written by student -->
	<div id="setup" class="container">
		<h1>TIC TAC TOE</h1>

			<label for="p1">Player 1</label>
			<input type="text" name="p1" id="player-1">
			<br>
			<label for="p2">Player 2</label>
			<input type="text" name="p2" id="player-2">

	</div>

	<div id="game" class="container hidden">
		<div>
			<h1>TIC TAC TOE</h1>
			<div class="message" id="status"></div>
		</div>
		<div id="board">
			<div class="cell" data-index="0" id="1"></div>
			<div class="cell" data-index="1" id="2"></div>
			<div class="cell" data-index="2" id="3"></div>
			<div class="cell" data-index="3" id="4"></div>
			<div class="cell" data-index="4" id="5"></div>
			<div class="cell" data-index="5" id="6"></div>
			<div class="cell" data-index="6" id="7"></div>
			<div class="cell" data-index="7" id="8"></div>
			<div class="cell" data-index="8" id="9"></div>
		</div>
	</div>











	
    <script type="text/javascript" src="./script.js">
</script>

</body>

</html>
